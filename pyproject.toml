[project]
name = "manor"
version = "0.1.1"
description = "Self-hosted AI workspace runtime for agents, tools, documents, workflows, and integrations"
requires-python = ">=3.11"
license = { text = "Manor Sustainable Use License 1.0" }
keywords = ["ai-agents", "agentic-ai", "self-hosted", "workflow-automation", "rag"]
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.31",
    # Database
    # SQLAlchemy 2.1 selects psycopg3 for postgresql://; this app ships psycopg2.
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "passlib[bcrypt]>=1.7",
    # Redis
    "redis>=5.0",
    # HTTP
    "httpcore>=1.0.9,<2",
    "httpx>=0.28,<1",
    # Security floor for aiohttp's transitive HTTP header container.
    "multidict>=6.9.1,<7",
    "websockets>=15,<17",
    # Local speech detection; reject noise before transcription or barge-in.
    "webrtcvad-wheels==2.0.14",
    # Discord Interactions Ed25519 signature verification
    "PyNaCl>=1.5",
    # Discord Gateway client for Guild mention events
    "discord.py>=2.6,<3",
    # AI
    "openai>=1.0",
    # Queue
    "celery>=5.4",
    # Email
    "aiosmtplib>=5.1.1",
    "PySocks>=1.7.1",
    # IO
    "aiofiles>=24.0",
    "stripe>=8.0",
    # Office docs
    "openpyxl>=3.1",
    "Markdown>=3.5",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    # PDF text extraction — used by chat-attachment + RAG ingest. ``pypdf``
    # is the maintained fork of PyPDF2.
    "pypdf>=6.16.1",
    # PDF generation for document and group chat file tools.
    "reportlab>=4.4.9,<5",
    # Search (free DuckDuckGo fallback)
    "ddgs>=7.0",
    # Object storage (MinIO skill files)
    "minio>=7.0",
    # Utils
    "python-ulid>=3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
    "tldextract>=5.3,<6",
    # Credential vault
    "hvac>=2.0",
    "cryptography>=50.0.0",
    # JWT signing and verification for the shared OSS authentication flow.
    "PyJWT>=2.15.0",
    # Workspace memory (frontmatter parsing, wiki-link rendering)
    "PyYAML>=6.0",
    # Step I/O strict validation (M3 dispatcher)
    "jsonschema[format]>=4.20",
    "referencing>=0.28.4",
    "defusedxml>=0.7.1,<1",
    "click>=8.3.3",
    "idna>=3.15",
    "urllib3>=2.8.0",
    "mako>=1.3.12",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0,<2",
    "pyasn1>=0.6.4",
    "starlette>=1.3.1",
    # CASA dependency gate: 4.14.2 fixes TLS hostname validation and process
    # pool stderr denial-of-service advisories present in AnyIO 4.13.0.
    "anyio>=4.14.2",
]

[project.urls]
Homepage = "https://manorai.xyz"
Repository = "https://github.com/manor-os/manor-ai"
Issues = "https://github.com/manor-os/manor-ai/issues"
Documentation = "https://github.com/manor-os/manor-ai#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-split>=0.11,<1",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    # PDF skill regression tests generate real documents with the bundled runtime.
    "fpdf2>=2.8",
    # Used by smoke tests that spin up an in-memory engine.
    "aiosqlite>=0.21",
]
# Extra PDF backends beyond the core `pypdf` dependency.
pdf = ["pdfplumber>=0.11"]
# OTEL — install with `pip install manor[otel]` to enable tracing.
# Without this extra, packages.core.observability silently no-ops.
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
# Patchright (browser adapter for M7). Heavy install — Chromium binary
# downloaded at first `patchright install chromium` run.
browser = [
    "patchright>=1.49",
]

[project.scripts]
# Top-level Manor commands. Available after `pip install -e .` (or wheel install).
# `manor-api` boots the FastAPI app under uvicorn — handy for ops scripts
# that don't want to remember the module path.
manor-api = "apps.api.main:run_cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "unit: small tests that do not require app, database, network, or external services",
    "integration: tests that exercise app or service boundaries with local fixtures",
    "e2e: end-to-end tests that require deployed/runtime surfaces or broad workflow setup",
    "manual: tests that are opt-in and should never run in default CI",
    "slow: tests that are too expensive for PR smoke",
    "network: tests that call live HTTP endpoints or third-party services",
    "docker: tests that require Docker or the local Docker Manor stack",
    "pgvector: tests that require PostgreSQL with pgvector support",
    "real_password_hashing: use the production bcrypt work factor in DB/API tests",
    "cloud: tests for cloud-only surfaces that are stripped from OSS export",
    "oss: tests for OSS/self-hosted mode contracts",
    "oss_smoke: tests included in the public OSS Python smoke CI gate",
    "oss_regression: tests included in the public OSS Python regression CI gate",
    "running_api: tests that require a running Manor API over HTTP",
    "running_runner: tests that require a running sidecar/runner over HTTP",
    "media_integration: tests that execute real local media binaries such as FFmpeg or FFprobe",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["packages*", "apps*"]

[tool.setuptools.package-data]
"packages.core.ai.mcp" = ["manor_pms_tools.json"]
"packages.core.memory" = ["skills/*/SKILL.md"]
"packages.core.services" = ["data/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.bandit]
# Unit-test fixtures and one-time Alembic migrations are reviewed separately;
# this application scan covers code reachable in the deployed runtime.
exclude_dirs = ["packages/core/tests", "packages/core/migrations"]
