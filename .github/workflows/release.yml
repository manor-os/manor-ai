name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve published source
        id: source
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD^{commit})"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_sha" origin/main || {
            echo "Tagged release source is not included in main." >&2
            exit 2
          }
          echo "release_sha=${release_sha}" >>"$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify public CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repository=manor-os/manor-ai
          branch=main
          event_args=(--event push --event workflow_dispatch)
          candidate_args=(--candidate-sha "${{ steps.source.outputs.release_sha }}")
          python3 scripts/verify_release_ci_evidence.py \
            --source-sha "${{ steps.source.outputs.release_sha }}" \
            --branch "${branch}" \
            --repository "${repository}" \
            "${event_args[@]}" \
            "${candidate_args[@]}" \
            --wait-seconds 3300

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
