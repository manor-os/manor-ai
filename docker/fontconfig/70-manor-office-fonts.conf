<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Microsoft 365 decks commonly declare Aptos. Debian's default fontconfig
    ranking can resolve it to Roboto Condensed, which changes PowerPoint text
    metrics enough to introduce artificial tracking and broken wrapping in
    LibreOffice renders. Carlito is the bundled Office-metric-compatible sans.
  -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Aptos</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Aptos Display</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Aptos Narrow</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Carlito</string></edit>
  </match>
</fontconfig>
