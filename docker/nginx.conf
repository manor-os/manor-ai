# Map http_upgrade → Connection header. When the client requests a
# WebSocket upgrade, send "upgrade"; otherwise send empty (so this
# header doesn't leak into normal HTTP requests). Required for
# /api/* locations that serve BOTH regular HTTP and WS endpoints
# (e.g. headed-login at /api/v1/integrations/headed-login/{sid}/stream).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

map $http_x_forwarded_proto $manor_forwarded_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Never cache a failed fingerprinted asset as an immutable success.
map $status $manor_static_cache_control {
    default "no-store";
    200 "public, max-age=31536000, immutable, no-transform";
    206 "public, max-age=31536000, immutable, no-transform";
    304 "public, max-age=31536000, immutable, no-transform";
}

# Signed download URLs carry credentials. Keep useful transfer diagnostics
# without the original query string or Referer from the combined log format.
log_format manor_download '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent request_time=$request_time '
                          'upstream_status=$upstream_status upstream_time=$upstream_response_time';

server {
    listen ${MANOR_WEB_LISTEN_PORT};
    root /usr/share/nginx/html;
    index index.html;

    # Compress static application assets even when no CDN sits in front of us.
    # Leave JSON APIs and event streams outside this compression policy.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/wasm image/svg+xml;

    # Service IPs can change when API/chat containers or pods are recreated.
    # Nginx renders this from the runtime resolver so Compose uses Docker DNS
    # and other orchestrators use their own service DNS.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $api_upstream ${MANOR_API_UPSTREAM};
    set $chat_upstream ${MANOR_CHAT_UPSTREAM};

    client_max_body_size 500m;
    # Keep routine API POST bodies, like worker heartbeats, out of temp files.
    client_body_buffer_size 1m;
    # The app is an authenticated SPA. Search-visible content lives on the
    # public landing site, so every app route should be removable from indexes.
    include /etc/nginx/snippets/manor-app-security-headers.conf;

    # Only the native task composer can be framed by our companion apps.
    # Keep all other authenticated pages on the default DENY policy.
    location = /calendar-picker/embed {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors https://minutes.manorai.xyz; form-action 'self' https:; script-src 'self' https://apis.google.com https://accounts.google.com/gsi/client https://static.cloudflareinsights.com https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https:; media-src 'self' blob: https:; frame-src 'self' blob: https:; worker-src 'self' blob:; connect-src 'self' https: wss: ws:; manifest-src 'self'" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location = /task-import/embed {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors https://minutes.manorai.xyz https://portfolio.manorai.xyz; form-action 'self' https:; script-src 'self' https://apis.google.com https://accounts.google.com/gsi/client https://static.cloudflareinsights.com https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https:; media-src 'self' blob: https:; frame-src 'self' blob: https:; worker-src 'self' blob:; connect-src 'self' https: wss: ws:; manifest-src 'self'" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/manor-app-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # Keep sitemap probes out of the authenticated SPA fallback.
    location = /sitemap.xml {
        return 404;
    }

    # Keep SPA entry points effectively uncached so new sessions pick up the
    # latest release quickly after deploy.
    location = /index.html {
        include /etc/nginx/snippets/manor-app-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Manor-Service-Role "web" always;
        expires -1;
        try_files $uri =404;
    }

    location = /admin.html {
        include /etc/nginx/snippets/manor-app-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # Build metadata used by the in-app "new version available" prompt.
    location = /version.json {
        include /etc/nginx/snippets/manor-app-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # This document is independent of Vite chunks. Do not clear cookies or
    # storage: authentication, drafts and the bounded retry budget must survive.
    location = /app-recovery.html {
        include /etc/nginx/snippets/manor-app-security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Clear-Site-Data '"cache"' always;
        try_files $uri =404;
    }

    # Unfingerprinted classic script that every index.html load runs first
    # (the customer-trial frame's storage isolation); revalidate each load.
    location = /embed-isolate.js {
        include /etc/nginx/snippets/manor-app-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~ ^/app-recovery\.(js|css)$ {
        include /etc/nginx/snippets/manor-app-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Generated HTML is rendered only inside this trusted outer shell. Defining
    # headers here stops inheritance of the app-wide DENY/strict CSP while the
    # generated document itself remains in a no-same-origin nested sandbox.
    location = /html-preview-shell.html {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src data: blob: http: https:; base-uri about:; object-src 'none'; frame-ancestors 'self'; form-action 'none'; script-src 'self' data: blob: http: https: 'unsafe-inline' 'unsafe-eval'; style-src data: blob: http: https: 'unsafe-inline'; img-src data: blob: http: https:; font-src data: blob: http: https:; media-src data: blob: http: https:; frame-src data: blob: http: https:; connect-src data: blob: http: https: ws: wss:" always;
        add_header Cache-Control "no-store" always;
        expires -1;
        try_files $uri =404;
    }

    # Fingerprinted Vite assets are safe to cache aggressively.
    location /assets/ {
        include /etc/nginx/snippets/manor-app-security-headers.conf;
        add_header Cache-Control $manor_static_cache_control always;
        try_files $uri =404;
    }

    # Stock nginx mime.types has no entry for `.mjs`, so it falls back to
    # `application/octet-stream`. Browsers refuse to dynamically import an
    # ES module with that MIME type, which broke the PDF.js worker
    # (`/assets/pdf.worker.min-*.mjs`) on staging-dev. Override the type
    # for .mjs explicitly. types {} would replace the inherited mime.types
    # hash entirely, so we use a location-scoped default_type instead.
    location ~* \.mjs$ {
        include /etc/nginx/snippets/manor-app-security-headers.conf;
        add_header Cache-Control $manor_static_cache_control always;
        default_type application/javascript;
        try_files $uri =404;
    }

    # Admin SPA: /admin* → admin.html
    location /admin {
        try_files $uri $uri/ /admin.html;
    }

    # Public Webchat is intentionally embeddable on customer websites. Defining
    # headers here stops inheritance of the app-wide X-Frame-Options: DENY and
    # replaces frame-ancestors 'none' while preserving the rest of the browser
    # security baseline. The tokenized public route is the only SPA surface
    # that may be framed by third-party origins.
    location ^~ /chat/public/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors http: https:; form-action 'self' https:; script-src 'self' https://static.cloudflareinsights.com https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https:; media-src 'self' blob: https:; frame-src 'self' blob: https:; worker-src 'self' blob:; connect-src 'self' https: wss: ws:; manifest-src 'self'" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files /index.html =404;
    }

    # The customer-trial frame (apps/web/src/embed) is the one app surface the
    # app may frame, and only from this origin. Defining headers here stops
    # inheritance of the app-wide DENY / frame-ancestors 'none'; every other
    # route keeps them.
    location ^~ /embed/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https:; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https:; media-src 'self' blob: https:; frame-src 'self' blob: https:; worker-src 'self' blob:; connect-src 'self' https: wss: ws:; manifest-src 'self'" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files /index.html =404;
    }

    location ~ ^/marketplace(?:/|$) { return 404; }

    # The SPA marketplace alias shares its name with public Blueprint assets.
    # Serve the app at the directory root; keep nested asset URLs unchanged.
    location = /blueprints {
        rewrite ^ /index.html last;
    }

    location = /blueprints/ {
        rewrite ^ /index.html last;
    }

    # SPA: all routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket proxy → FastAPI backend
    location /ws {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $manor_forwarded_scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Long-lived SSE and first-token-sensitive generation paths → chat service.
    location = /api/v1/chat/stream {
        proxy_pass http://$chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $manor_forwarded_scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/v1/chat/runs/[^/]+/events$ {
        proxy_pass http://$chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $manor_forwarded_scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/v1/public/chat/[^/]+/message/stream$ {
        proxy_pass http://$chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $manor_forwarded_scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/v1/workspace-drafts/stream {
        proxy_pass http://$chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $manor_forwarded_scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/v1/workspace-drafts/[^/]+/(messages|finalize)/stream$ {
        proxy_pass http://$chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $manor_forwarded_scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/v1/(agents/(generate-stream|generate-draft-stream)|skills/generate-stream)$ {
        proxy_pass http://$chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $manor_forwarded_scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Stream this endpoint with a 1 GiB file ceiling plus multipart room,
    # instead of buffering up to the server-wide 500 MiB limit.
    location ~ ^/api/v1/chat/rooms/[^/]+/files/?$ {
        client_max_body_size 1025m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $manor_forwarded_scheme;
    }

    # Large group downloads are verified on disk, then streamed to the browser.
    location ~ ^/api/v1/chat/rooms/[^/]+/file-downloads(?:/[^/]+)?/?$ {
        access_log /var/log/nginx/access.log manor_download;
        # Nginx's fixed error format includes the original signed URL and
        # Referer. The safe access log retains status and upstream diagnostics.
        error_log /dev/null;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $manor_forwarded_scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API proxy → FastAPI backend.
    # Carries WS endpoints too (headed-login at /api/v1/integrations/
    # headed-login/{sid}/stream), so we set Upgrade/Connection headers
    # conditionally via the $connection_upgrade map at the top of this
    # file. Without these, the WS upgrade silently downgrades to plain
    # HTTP and the noVNC client closes with code 1006.
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $manor_forwarded_scheme;

        # SSE streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OAuth discovery (RFC 8414 / RFC 9728) for MCP clients signing in to
    # the hosted MCP endpoint at /api/v1/mcp.
    location ^~ /.well-known/oauth- {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $manor_forwarded_scheme;
    }

    # Config endpoint
    location /config {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    # Health check
    location /health {
        proxy_pass http://$api_upstream;
    }
}
