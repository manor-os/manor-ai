<!DOCTYPE html>
<html lang="{{ email_locale }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>{{ title }}</title>
    <style>
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        table { border-collapse: collapse !important; }
        img { -ms-interpolation-mode: bicubic; border: 0; display: block; height: auto; line-height: 100%; outline: none; text-decoration: none; }

        .body-content p { margin: 0 0 16px 0; }
        .body-content p:last-child { margin-bottom: 0; }
        .body-content a { color: #436b65; text-decoration: underline; }
        .body-content strong { color: #1c1917; font-weight: 700; }
        .body-content h1, .body-content h2, .body-content h3 {
            color: #1c1917; font-weight: 700; margin: 24px 0 12px; line-height: 1.3;
        }
        .body-content h1 { font-size: 22px; }
        .body-content h2 { font-size: 18px; }
        .body-content h3 { font-size: 16px; }
        .body-content ul, .body-content ol { margin: 0 0 16px 24px; padding: 0; }
        .body-content li { margin-bottom: 6px; }
        .body-content code {
            background: #f2f1ee; border-radius: 4px; font-family: Menlo, Consolas, monospace;
            font-size: 13px; padding: 2px 6px;
        }
        .body-content blockquote {
            border-left: 3px solid #d8d4ce; color: #57534e; margin: 12px 0; padding: 4px 12px;
        }
        .body-content table { border-collapse: collapse; font-size: 14px; margin: 0 0 16px; width: 100%; }
        .body-content th, .body-content td { border: 1px solid #e8e5df; padding: 8px 12px; text-align: left; }
        .body-content th { background: #f7f6f3; color: #1c1917; font-weight: 700; }
        .body-content img { border-radius: 8px; margin: 12px 0; max-width: 100%; }
        .body-content hr { border: 0; border-top: 1px solid #e8e5df; margin: 20px 0; }

        @media only screen and (max-width: 640px) {
            .email-shell { padding: 16px 10px !important; }
            .email-card { border-radius: 16px !important; }
            .content-pad { padding-left: 24px !important; padding-right: 24px !important; }
            .hero-title { font-size: 25px !important; line-height: 32px !important; }
            .cta-link { display: block !important; padding: 13px 20px !important; }
        }
    </style>
</head>

<body style="width:100% !important;margin:0;padding:0;background-color:#f7f6f3;font-family:Arial,Helvetica,sans-serif;color:#292524;">
    {{ preheader_block }}
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background-color:#f7f6f3;">
        <tr>
            <td class="email-shell" align="center" style="padding:32px 16px;">
                <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="email-card" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #efede8;border-radius:20px;box-shadow:0 18px 44px rgba(68,64,60,0.08);overflow:hidden;">
                    <tr>
                        <td class="content-pad" style="padding:30px 40px 22px;border-bottom:1px solid #efede8;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td width="32" style="width:32px;vertical-align:middle;">
                                        <img src="{{ app_url }}/email-logo.png" width="32" height="32" alt="Manor AI" class="logo-icon" style="display:block;border:0;outline:none;text-decoration:none;border-radius:8px;">
                                    </td>
                                    <td style="padding-left:12px;vertical-align:middle;color:#1c1917;font-size:18px;font-weight:700;letter-spacing:-0.3px;">
                                        Manor AI
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td class="content-pad" align="center" style="padding:38px 40px 14px;text-align:center;">
                            <span style="display:inline-block;margin-bottom:14px;padding:5px 11px;border-radius:999px;background:{{ severity_bg }};color:{{ severity_color }};font-size:10px;font-weight:700;letter-spacing:0.9px;text-transform:uppercase;">{{ severity_label }}</span>
                            <h1 class="hero-title" style="margin:0;color:#1c1917;font-size:29px;font-weight:700;letter-spacing:-0.6px;line-height:37px;">
                                {{ title }}
                            </h1>
                        </td>
                    </tr>

                    <tr>
                        <td class="content-pad" style="padding:20px 40px 38px;">
                            <p style="margin:0 0 16px;color:#44403c;font-size:16px;line-height:26px;">{{ greeting }}</p>
                            <div class="body-content" style="color:#44403c;font-size:15px;line-height:26px;overflow-wrap:anywhere;">
                                {{ body_html }}
                            </div>
                        </td>
                    </tr>

                    {{ cta_block }}

                    <tr>
                        <td class="content-pad" align="center" style="padding:28px 40px;background-color:#fbfbfa;border-top:1px solid #efede8;text-align:center;">
                            <p style="margin:0 0 8px;color:#292524;font-size:13px;font-weight:700;">{{ footer_title }}</p>
                            <p style="margin:0;color:#78716c;font-size:11px;line-height:18px;">
                                {{ footer_note }}{{ unsubscribe_block }}<br>
                                {{ rights_reserved }} &copy; Manor AI {{ year }}
                            </p>
                        </td>
                    </tr>
                </table>
                <!--[if mso]></td></tr></table><![endif]-->
            </td>
        </tr>
    </table>
</body>

</html>
