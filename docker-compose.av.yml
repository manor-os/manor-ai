# Optional ClamAV upload scanner for the base Manor Compose stack.
#
# Start Manor with upload scanning enabled:
#   docker compose -f docker-compose.yml -f docker-compose.av.yml up -d

services:
  api:
    environment:
      UPLOAD_AV_REQUIRED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT_SECONDS: "120"
    depends_on:
      clamav:
        condition: service_healthy

  clamav:
    image: clamav/clamav:1.5-debian13-slim
    container_name: manor-os-clamav
    environment:
      CLAMD_CONF_StreamMaxLength: 500M
      CLAMD_CONF_MaxFileSize: 500M
      CLAMD_CONF_MaxScanSize: 2G
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 10m
    restart: unless-stopped

volumes:
  clamav_db:
